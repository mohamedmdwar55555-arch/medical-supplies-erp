<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة شركة المستلزمات الطبية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--sf:#fff;--tx:#1b2430;--mu:#6b7686;--bd:#e2e7ee;--pr:#0f766e;--pl:#d9f2ef;--dn:#c2410c;--ok:#15803d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10161d;--sf:#18212b;--tx:#e6ebf1;--mu:#93a0b0;--bd:#2a3644;--pr:#2dd4bf;--pl:#12332f;--dn:#fb923c;--ok:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{color:var(--pr);font-size:17px}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:7px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--pr);color:var(--bg);border-color:var(--pr)}
main{padding:14px;max-width:1100px;margin:auto}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.k small{color:var(--mu);display:block}.k b{font-size:18px}
h3{margin:0 0 10px;font-size:16px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end}
label{font-size:12px;color:var(--mu);display:block}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.b{background:var(--pr);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.b.s{background:var(--pl);color:var(--pr)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mu);font-weight:600}
.pos{color:var(--ok)}.neg{color:var(--dn)}
.ln{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;margin-bottom:6px}
#msg{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:10px;color:#fff;display:none;z-index:9}
.don{width:170px;height:170px;display:block;margin:auto}
.sk{height:80px;border-radius:12px;margin-bottom:12px;background:linear-gradient(90deg,var(--bd),var(--sf),var(--bd));background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.av{width:32px;height:32px;border-radius:50%;background:var(--pr);color:var(--bg);display:inline-flex;align-items:center;justify-content:center;font-weight:700;margin-inline-start:10px}
header{gap:8px}header small{margin-inline-start:auto}
#lg{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding:16px;background:#02001a url(assets/login-bg.jpg) center/cover no-repeat;color:#e8e6df;overflow:auto}
.lc{width:100%;max-width:400px;background:#0a0720cc;backdrop-filter:blur(10px);border:1px solid #3a2f66;border-radius:18px;padding:28px;box-shadow:0 24px 70px #000a}
.lc h1{font-size:20px;color:#d4af37;margin:6px 0 2px;text-align:center}.lc p{color:#93a0b0;text-align:center;margin:0 0 16px}.lc label{color:#aeb8c6;margin-top:10px}
.lc input{background:#0a1220;border-color:#2b3550;color:#fff;padding:11px}.lc input:focus{outline:0;border-color:#d4af37}
.lw{position:relative}.lw button{position:absolute;inset-inline-start:6px;top:5px;background:0;border:0;cursor:pointer;font-size:16px}
.lr{display:flex;gap:6px;align-items:center}.lr input{width:auto}
.le{color:#fb7185;min-height:20px;margin-top:8px;font-size:13px}
.lbtn{width:100%;margin-top:6px;padding:12px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;color:#10151f;background:linear-gradient(135deg,#e6c25a,#b8902a);transition:.2s}.lbtn:hover{transform:translateY(-1px);box-shadow:0 8px 22px #d4af3740}.lbtn.ld{opacity:.6;pointer-events:none}.lbtn.ld::after{content:" …"}
.lc small{display:block;color:#6b7686;text-align:center;margin-top:14px;font-size:11px}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:4px;margin:8px 0}.pg label{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:13px}.pg input{width:auto}
@media(min-width:900px){body{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr;align-items:start}header{grid-column:1/3}nav{flex-direction:column;overflow:visible;border-bottom:0;border-inline-end:1px solid var(--bd);position:sticky;top:64px;min-height:calc(100vh - 64px)}nav button{text-align:right;border-radius:10px;padding:10px 14px}main{width:100%}}
#inv{display:none}
@media print{body>*:not(#inv){display:none!important}#inv{display:block;padding:20px;color:#000;background:#fff}}
</style></head><body>
<header><b>🩺 نظام إدارة المستلزمات الطبية</b><small id="st"></small><span id="us" class="av"></span><button class="b s" id="bl" onclick="bellToggle()" style="display:none;position:relative">🔔<i id="bc" style="display:none;position:absolute;top:-6px;inset-inline-end:-6px;background:#e11d48;color:#fff;border-radius:10px;font-size:11px;font-style:normal;padding:1px 6px"></i></button><button class="b s" id="lo" onclick="logout()" style="display:none">خروج</button></header>
<nav id="nav"></nav><main id="app"><div class="sk"></div><div class="sk"></div><div class="sk"></div></main><div id="msg"></div><div id="inv"></div>
<script>
const T=[["dash","📊 الرئيسية"],["part","🤝 الشركاء ورأس المال"],["stock","📦 الأصناف والمخزون"],["buy","🛒 المشتريات"],["sell","🧾 المبيعات"],["cash","💰 الخزنة والبنك"],["exp","💸 المصروفات"],["audit","🛡️ سجل التعديلات"]];
const EMPTY={seq:1,partners:[],cap:[],prods:[],buys:[],sales:[],exps:[],led:[],rec:{},pay:{}};
let S=structuredClone(EMPTY),tab="dash",ref=null,user="مستخدم",RO=false,RO0=false,ME=null,NE=false,R="month",CF="",CT="",hl=0;
const PAL=["#2563eb","#10b981","#d4a017","#9333ea","#e11d48","#0891b2"];
const pnm=p=>`<span onclick="hlP(${p.id})" style="cursor:pointer;font-weight:${hl===p.id?700:400}"><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${p.color};margin-inline-end:6px"></i>${esc(p.name)}</span>`;
function hlP(id){hl=hl===id?0:id;render()}
const D=d=>d.toISOString().slice(0,10);
function rng(){const t=new Date(now().slice(0,10)),y=t.getUTCFullYear(),m=t.getUTCMonth();let f=new Date(t),e=new Date(t);if(R==="week")f.setUTCDate(t.getUTCDate()-((t.getUTCDay()+1)%7));else if(R==="month")f=new Date(Date.UTC(y,m,1));else if(R==="last"){f=new Date(Date.UTC(y,m-1,1));e=new Date(Date.UTC(y,m,0))}else if(R==="year")f=new Date(Date.UTC(y,0,1));else if(R==="custom"&&CF&&CT){f=new Date(CF);e=new Date(CT)}else if(R==="all")f=new Date("2000-01-01");const n=Math.round((e-f)/864e5)+1,pe=new Date(f),pf=new Date(f);pe.setUTCDate(f.getUTCDate()-1);pf.setUTCDate(f.getUTCDate()-n);return[D(f),D(e),D(pf),D(pe)]}
const P=v=>Math.round(parseFloat(v||0)*100),M=p=>(p/100).toLocaleString("ar-EG",{minimumFractionDigits:2})+" ج.م";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=()=>new Date().toLocaleString("sv-SE",{timeZone:"Africa/Cairo"}).slice(0,16);
const $=s=>document.querySelector(s),val=id=>document.getElementById(id).value;
function toast(t,ok=true){const m=$("#msg");m.textContent=t;m.style.background=ok?"#15803d":"#b91c1c";m.style.display="block";setTimeout(()=>m.style.display="none",ok?3000:5500)}
async function load(){
  try{const u=await claude.use("user");if(u){RO=RO0=u.can("data.write")===false;if(typeof u.name==="string"&&u.name)user=u.name}}catch(e){}
  try{const db=await claude.use("db");if(db){ref=db.doc("erp/state");const s=await ref.get();if(s.exists)S=s.data();$("#st").textContent="قاعدة بيانات دائمة";ref.onSnapshot(sn=>{if(!sn.exists||busy)return;const d=sn.data();if(JSON.stringify(d).length===JSON.stringify(S).length)return;const ln=(S.notes||[]).length;S=d;if(ME){updBell();const nn=d.notes||[];if(nn.length>ln){const t=nn[nn.length-1];if(t.by!==user)toast("🔔 "+t.text);if(tab==="dash"&&!$("#md"))render()}}},()=>{});return}}catch(e){}
  try{const l=localStorage.getItem("erp");if(l)S=JSON.parse(l)}catch(e){}
  $("#st").textContent="حفظ محلي على هذا المتصفح"}
// كل عملية تُنفَّذ على نسخة ثم تُحفظ دفعة واحدة (كل شيء أو لا شيء)
let busy=false;async function tx(fn,okMsg){if(busy)return toast("جارٍ تنفيذ عملية سابقة…",false);busy=true;document.body.style.cursor="progress";const c=structuredClone(S);try{fn(c);mkNotes(S,c);if(ref)await ref.set(c);else try{localStorage.setItem("erp",JSON.stringify(c))}catch(e){}S=c;toast(okMsg);render()}catch(e){toast(e.message||"فشلت العملية",false)}finally{busy=false;document.body.style.cursor=""}}
const nid=(c)=>c.seq++;
function led(c,acct,amt,type,desc){c.led.push({id:nid(c),at:now(),acct,amt,type,desc,by:user})}
const bal=a=>S.led.filter(x=>x.acct===a).reduce((s,x)=>s+x.amt,0);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const fac=(p,u)=>u==="carton"?p.box*p.pcs:u==="box"?p.pcs:1;
const UN={piece:"قطعة",box:"علبة",carton:"كرتونة"};
function stockTxt(p){const c=Math.floor(p.qty/(p.box*p.pcs)),r=p.qty-c*p.box*p.pcs,b=Math.floor(r/p.pcs);return `${c} كرتونة + ${b} علبة + ${r-b*p.pcs} قطعة`}
function own(){const m={};S.partners.forEach(p=>m[p.id]=0);S.cap.forEach(x=>{if(x.type==="contrib")m[x.pid]+=x.amt;if(x.type==="reduce")m[x.pid]-=x.amt});const t=sum(Object.values(m),x=>x);return{m,t}}
function fin(r){const w=a=>(r?a.filter(x=>x.at.slice(0,10)>=r[0]&&x.at.slice(0,10)<=r[1]):a).filter(x=>!x.cancelled);const sales=sum(w(S.sales),s=>s.total),cogs=sum(w(S.sales),s=>s.cogs),ex=sum(w(S.exps),e=>e.amt),buys=sum(w(S.buys),b=>b.total);return{sales,cogs,ex,buys,gp:sales-cogs,np:sales-cogs-ex}}
function table(h,rows){return `<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")||`<tr><td colspan="${h.length}" style="text-align:center;color:var(--mu);padding:22px">📭 لا توجد بيانات بعد</td></tr>`}</table></div>`}
const sel=(id,opts)=>`<select id="${id}">${opts.map(o=>`<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`;
const fld=(l,x)=>`<div><label>${l}</label>${x}</div>`;
const inp=(id,t="text",x="")=>`<input id="${id}" type="${t}" ${x}>`;
const pay=id=>sel(id,[["cash","نقدي (الخزنة)"],["bank","تحويل بنكي"],["credit","آجل"]]);
const V={
dash(){const rg=rng(),f=fin(rg),g=R==="all"?f:fin([rg[2],rg[3]]),o=own(),low=S.prods.filter(p=>p.qty<=p.min);
const ch=(c,p)=>{if(R==="all")return"";if(!p)return c?`<small class="pos">▲ جديد</small>`:"";const d=(c-p)/Math.abs(p)*100;return `<small class="${d>=0?"pos":"neg"}">${d>=0?"▲":"▼"} ${Math.abs(d).toFixed(1)}% عن الفترة السابقة</small>`};
const k=(a,b,c="",pv)=>`<div class="c k"><small>${a}</small><b class="${c}">${b}</b>${pv?ch(pv[0],pv[1]):""}</div>`;
const bs={};S.sales.filter(s=>!s.cancelled&&s.at.slice(0,10)>=rg[0]&&s.at.slice(0,10)<=rg[1]).forEach(s=>s.lines.forEach(l=>bs[l.n]=(bs[l.n]||0)+l.base));
const fl=`<div class="c fl"><div class="f"><div><label>الفترة</label><select onchange="R=this.value;render()">${[["today","اليوم"],["week","هذا الأسبوع"],["month","هذا الشهر"],["last","الشهر الماضي"],["year","هذه السنة"],["custom","فترة مخصصة"],["all","الكل"]].map(o=>`<option value="${o[0]}" ${o[0]===R?"selected":""}>${o[1]}</option>`).join("")}</select></div>${R==="custom"?`<div><label>من</label><input type="date" value="${CF}" onchange="CF=this.value;render()"></div><div><label>إلى</label><input type="date" value="${CT}" onchange="CT=this.value;render()"></div>`:""}</div></div>`;
 return `${fl}<div class="g">${k("رأس المال",M(o.t))}${k("رصيد الخزنة",M(bal("cash")))}${k("رصيد البنك",M(bal("bank")))}${k("المخزون بالتكلفة",M(sum(S.prods,p=>p.value)))}${k("المبيعات",M(f.sales),"",[f.sales,g.sales])}${k("المشتريات",M(f.buys),"",[f.buys,g.buys])}${k("المصروفات",M(f.ex),"",[f.ex,g.ex])}${k("مجمل الربح",M(f.gp),"",[f.gp,g.gp])}${k("صافي الربح/الخسارة",M(f.np),f.np>=0?"pos":"neg",[f.np,g.np])}${k("مستحق على العملاء",M(sum(Object.values(S.rec),x=>x)))}${k("مستحق للموردين",M(sum(Object.values(S.pay),x=>x)))}${k("عدد الأصناف / العملاء",S.prods.length+" / "+Object.keys(S.rec).length)}</div>
 ${charts()}<div class="c"><h3>أكثر الأصناف مبيعًا في الفترة (بالقطع)</h3>${table(["الصنف","الكمية"],Object.entries(bs).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,q])=>[esc(n),q]))}</div><div class="c"><h3>آخر العمليات</h3>${table(["التاريخ","النوع","الوصف","المبلغ"],S.led.slice(-8).reverse().map(x=>[x.at,x.type,esc(x.desc),M(x.amt)]))}</div><div class="c"><h3>أصناف أوشكت على النفاد (${low.length})</h3>${table(["الصنف","الرصيد","حد الطلب"],low.map(p=>[esc(p.name),stockTxt(p),p.min]))}</div>`},
part(){const o=own();let a=0;const sg=S.partners.map(p=>{const v=o.m[p.id],s=o.t>0?v/o.t*100:0,on=hl===p.id,d=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${p.color}" stroke-width="${on?7:5}" stroke-dasharray="${s} ${100-s}" stroke-dashoffset="${25-a}" style="cursor:pointer;opacity:${hl&&!on?.35:1}" onclick="hlP(${p.id})"><title>${esc(p.name)}: ${M(v)} (${s.toFixed(2)}%)</title></circle>`;a+=s;return d}).join("");
 const loans=id=>sum(S.cap.filter(x=>x.pid===id),x=>x.type==="loan"?x.amt:x.type==="repay"?-x.amt:0);
 return `<div class="c"><h3>إضافة شريك</h3><div class="f">${fld("الاسم",inp("pn"))}<button class="b" onclick="addPartner()">إضافة</button></div></div>
 <div class="c"><h3>نسب الملكية (حسب رأس المال المعتمد فقط)</h3>${o.t>0?`<svg class="don" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--bd)" stroke-width="5"/>${sg}</svg>`:""}
 ${table(["الشريك","رأس المال","النسبة","قرض الشريك (لا يؤثر في النسبة)"],S.partners.map(p=>[pnm(p),M(o.m[p.id]),(o.t?o.m[p.id]/o.t*100:0).toFixed(2)+"%",M(loans(p.id))]))}</div>
 <div class="c"><h3>تسجيل حركة</h3><div class="f">${fld("الشريك",sel("cp",S.partners.map(p=>[p.id,p.name])))}${fld("النوع",sel("ct",[["contrib","مساهمة رأسمالية (نقدي)"],["reduce","تخفيض رأس مال معتمد"],["loan","قرض من الشريك للشركة"],["repay","سداد قرض للشريك"]]))}${fld("المبلغ",inp("ca","number","step=0.01"))}${fld("ملاحظات",inp("cn"))}<button class="b" onclick="capMove()">تسجيل</button></div></div>
 <div class="c"><h3>سجل الحركات</h3>${table(["#","الشريك","النوع","المبلغ","التاريخ","ملاحظات","المستخدم",""],S.cap.slice().reverse().map(x=>[x.id,(q=>q?pnm(q):"")(S.partners.find(p=>p.id==x.pid)),{contrib:"مساهمة",reduce:"تخفيض رأس مال",loan:"قرض",repay:"سداد قرض"}[x.type],M(x.amt),x.at,esc(x.note),x.by,RO?"":`<button class="b s" onclick="editCap(${x.id})">تعديل</button>`]))}</div>`},
stock(){return `<div class="c"><h3>إضافة صنف</h3><div class="f">${fld("الكود SKU",inp("sk"))}${fld("الاسم",inp("nm"))}${fld("علب في الكرتونة",inp("bx","number","value=10"))}${fld("قطع في العلبة (اكتب 1 لو بتبيع العلبة كوحدة واحدة)",inp("pc","number","value=100"))}${fld("سعر البيع للوحدة الأساسية (القطعة أو العلبة)",inp("sp","number","step=0.01"))}${fld("حد إعادة الطلب (قطع)",inp("mn","number","value=0"))}<button class="b" onclick="addProd()">إضافة</button></div></div>
 <div class="c"><h3>المخزون (الوحدة الأساسية: القطعة)</h3>${table(["SKU","الصنف","الرصيد بالقطع","التفصيل","متوسط تكلفة الوحدة الأساسية","سعر البيع للوحدة الأساسية","هامش الربح","Markup","قيمة المخزون",""],S.prods.map(p=>{const cu=p.qty?p.value/p.qty:0,gm=p.price?(p.price-cu)/p.price*100:0,mk=cu?(p.price-cu)/cu*100:0;return [esc(p.sku),esc(p.name),p.qty,stockTxt(p),M(cu),`<input style="width:90px" type="number" step="0.01" value="${p.price/100}" onchange="setPrice(${p.id},this.value)">`,gm.toFixed(1)+"%",mk.toFixed(1)+"%",M(p.value),RO?"":`<button class="b s" onclick="editProd(${p.id})">تعديل الوحدات</button>`]}))}</div>`},
buy(){return `<div class="c"><h3>فاتورة شراء</h3><div class="f">${fld("المورد",inp("pt"))}${fld("طريقة الدفع",pay("pm"))}${fld("المدفوع (اتركه فارغًا = كامل/صفر للآجل)",inp("pd","number","step=0.01"))}${fld("رقم فاتورة المورد",inp("pn"))}</div><div id="ls" style="margin-top:10px"></div><button class="b s" onclick="addLine('b')">+ صنف</button> <button class="b" onclick="saveBuy()">حفظ الفاتورة</button></div>
 <div class="c"><h3>الفواتير</h3>${table(["#","التاريخ","المورد","الإجمالي","المدفوع","المتبقي",""],S.buys.slice().reverse().map(b=>[b.id+(b.cancelled?" ❌ملغاة":""),b.at,esc(b.party),M(b.total),M(b.paid),M(b.total-b.paid),RO||b.cancelled?"":`<button class="b s" onclick="cancelDoc('buys',${b.id})">إلغاء</button>`]))}</div>
 <div class="c"><h3>مستحقات الموردين</h3>${table(["المورد","المستحق"],Object.entries(S.pay).map(([k,v])=>[esc(k),M(v)]))}</div>`},

function saveSell(){const party=val("pt").trim(),m=val("pm"),pd=val("pd"),ds=P(val("ds"));tx(c=>{if(!party)throw Error("أدخل اسم العميل");const L=lines(c);let gross=0,cogs=0;const need={};L.forEach(l=>{need[l.p.id]=(need[l.p.id]||0)+l.base;if(need[l.p.id]>l.p.qty)throw Error(`الكمية غير كافية للصنف: ${l.p.name}`)});L.forEach(l=>{gross+=l.q*l.pr;l.cogs=l.p.qty===l.base?l.p.value:Math.round(l.p.value*l.base/l.p.qty);cogs+=l.cogs;l.p.qty-=l.base;l.p.value-=l.cogs});const total=gross-ds;if(total<0)throw Error("الخصم أكبر من الإجمالي");const id=nid(c),paid=payFlow(c,m,total,pd,"تحصيل مبيعات",`فاتورة بيع ${id} - ${party}`,1);c.rec[party]=(c.rec[party]||0)+total-paid;c.sales.push({id,at:now(),party,total,paid,cogs,ds,m,by:user,lines:L.map(l=>({n:l.p.name,u:l.u,q:l.q,pr:l.pr,base:l.base,cogs:l.cogs}))})},"تم حفظ الفاتورة وخصم المخزون وتسجيل التكلفة")}
function settle(){const t=val("kt"),n=val("kn").trim(),a=P(val("km")),ac=val("ka");tx(c=>{if(!n||!a)throw Error("أكمل البيانات");if(t==="adj"){if(bal2(c,ac)+a<0)throw Error("التسوية تجعل الرصيد سالبًا");led(c,ac,a,"تسوية",n);return}if(a<0)throw Error("المبلغ يجب أن يكون موجبًا");const m=t==="rec"?c.rec:c.pay;if(!m[n]||a>m[n])throw Error("المبلغ أكبر من المديونية أو الاسم غير موجود");if(t==="pay"&&bal2(c,ac)<a)throw Error("الرصيد لا يكفي");m[n]-=a;led(c,ac,t==="rec"?a:-a,t==="rec"?"تحصيل دين عميل":"سداد مورد",n)},"تم التسجيل")}
function addExp(){const a=P(val("ea")),m=val("em");tx(c=>{if(a<=0)throw Error("أدخل مبلغًا صحيحًا");const id=nid(c);const paid=payFlow(c,m,a,"","مصروف",`${val("ec")} - ${val("eb")}`,-1);if(m==="credit"){c.pay[val("eb")||"مستفيد"]=(c.pay[val("eb")||"مستفيد"]||0)+a}c.exps.push({id,at:now(),cat:val("ec"),amt:a,m,who:val("eb"),desc:val("ed"),by:user})},"تم تسجيل المصروف")}
function printInv(id){const s=S.sales.find(x=>x.id===id);$("#inv").innerHTML=`<h2>فاتورة بيع رقم ${s.id}</h2><p>التاريخ: ${s.at}<br>العميل: ${esc(s.party)}</p>${table(["الصنف","الوحدة","الكمية","السعر","الإجمالي"],s.lines.map(l=>[esc(l.n),UN[l.u],l.q,M(l.pr),M(l.q*l.pr)]))}<p>الخصم: ${M(s.ds||0)}<br><b>الإجمالي: ${M(s.total)}</b><br>المدفوع: ${M(s.paid)} — المتبقي: ${M(s.total-s.paid)}</p>`;window.print()}
load().then(()=>{S.partners.forEach((p,i)=>{p.color=p.color||PAL[i%PAL.length]});try{const sid=sessionStorage.getItem("erp_me")||localStorage.getItem("erp_me"),m=(S.users||[]).find(x=>String(x.id)===sid&&x.active);if(m){ME=m;user=m.name}}catch(e){}render()}).catch(e=>{$("#app").innerHTML="<div class=c>تعذر التحميل: "+esc(e&&e.message||e)+"</div>"});
</script></body></html>
